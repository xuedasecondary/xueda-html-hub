<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="学达教育 HTML 教学资源管理中心"><title>学达 HTML 教学资源中心</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">学</div><div><strong>学达教育</strong><span>HTML RESOURCE HUB</span></div></div><nav id="subjectNav" aria-label="科目导航"></nav><div class="sidebar-note"><span>本地安全模式</span><p>资料只储存在这台浏览器。</p></div></aside><main><header class="topbar"><button id="menuButton" class="icon-button menu-button" aria-label="开启菜单">☰</button><div><p class="eyebrow">TEACHING RESOURCE SYSTEM</p><h1 id="pageTitle">资源总览</h1></div><div class="header-actions"><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索文件夹或网页…"></label><button id="newFolderButton" class="secondary-button">＋ 新建文件夹</button><button id="newHtmlButton" class="primary-button">＋ 添加 HTML</button></div></header><section class="content"><div id="dashboardView"></div><div id="subjectView" hidden><div class="subject-summary"><div><span>当前科目</span><strong id="currentSubjectName"></strong></div><div><span>文件夹</span><strong id="folderCount">0</strong></div><div><span>HTML 网页</span><strong id="htmlCount">0</strong></div></div><section class="section-block"><div class="section-heading"><div><p>FOLDERS</p><h2>文件夹</h2></div></div><div id="folderGrid" class="card-grid"></div></section><section class="section-block"><div class="section-heading"><div><p>HTML ACTIVITIES</p><h2 id="htmlSectionTitle">全部网页</h2></div><button id="backToAllButton" class="text-button" hidden>查看全部</button></div><div id="htmlGrid" class="card-grid"></div></section></div></section></main></div>
<dialog id="folderDialog"><form id="folderForm" class="modal-card"><div class="modal-header"><div><p>ORGANISE</p><h2 id="folderDialogTitle">新建文件夹</h2></div><button type="button" class="close-button" data-close="folderDialog">×</button></div><label>文件夹名称<input id="folderName" maxlength="40" required placeholder="例如：Karangan"></label><input id="folderId" type="hidden"><div class="modal-actions"><button type="button" class="ghost-button" data-close="folderDialog">取消</button><button class="primary-button" type="submit">储存文件夹</button></div></form></dialog>
<dialog id="htmlDialog"><form id="htmlForm" class="modal-card modal-wide"><div class="modal-header"><div><p>HTML RESOURCE</p><h2 id="htmlDialogTitle">添加 HTML 网页</h2></div><button type="button" class="close-button" data-close="htmlDialog">×</button></div><div class="form-row"><label>网页名称<input id="htmlTitle" maxlength="70" required placeholder="例如：Kosa Kata Battle"></label><label>归类文件夹<select id="htmlFolder"></select></label></div><label>简短说明<input id="htmlDescription" maxlength="120" placeholder="这个网页有什么用途？"></label><label>完整 HTML Coding<textarea id="htmlCode" required spellcheck="false" placeholder="<!doctype html>\n<html>…"></textarea></label><p class="helper-text">只粘贴你信任的 HTML。系统会在独立页面中开启代码。</p><input id="htmlId" type="hidden"><div class="modal-actions"><button type="button" class="ghost-button" data-close="htmlDialog">取消</button><button class="primary-button" type="submit">储存 HTML</button></div></form></dialog><div id="toast" class="toast" role="status"></div><script src="app.js"></script></body></html>
