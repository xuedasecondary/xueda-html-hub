<style>

.mascot{width:230px;height:250px;margin:18px auto 4px;position:relative;filter:drop-shadow(0 0 28px #a55cff77);animation:bob 2.4s ease-in-out infinite}.ear{position:absolute;width:66px;height:145px;top:0;background:linear-gradient(#6f3dcc,#2b184f);border:5px solid #b98cff;border-radius:70% 70% 36% 36%;z-index:0}.ear.l{left:28px;transform:rotate(-12deg)}.ear.r{right:28px;transform:rotate(12deg)}.head{position:absolute;left:22px;right:22px;top:70px;height:155px;background:linear-gradient(145deg,#b279ff,#5d32ad);border:6px solid #d8baff;border-radius:48% 48% 44% 44%;z-index:2}.face{position:absolute;inset:25px 19px 20px;background:#f5d6b3;border-radius:48%;border:4px solid #2d173f}.eye{position:absolute;top:40px;width:19px;height:26px;border-radius:50%;background:#211332}.eye:after{content:"";position:absolute;width:6px;height:8px;border-radius:50%;background:white;left:4px;top:3px}.eye.l{left:42px}.eye.r{right:42px}.mouth{position:absolute;left:50%;top:78px;transform:translateX(-50%);width:80px;height:31px;background:#24102d;border-radius:6px 6px 35px 35px;overflow:hidden}.teeth{height:13px;background:repeating-linear-gradient(90deg,#fff 0 12px,#cfbddd 12px 14px);clip-path:polygon(0 0,100% 0,94% 100%,86% 20%,75% 100%,63% 20%,50% 100%,37% 20%,25% 100%,14% 20%,6% 100%)}.cheek{position:absolute;top:69px;width:18px;height:8px;border-radius:50%;background:#ff779b88}.cheek.l{left:15px}.cheek.r{right:15px}.badge{position:absolute;right:12px;bottom:10px;background:linear-gradient(135deg,var(--gold),#ff8d3a);color:#2b1533;padding:9px 14px;border-radius:999px;font-weight:1000;transform:rotate(-7deg);box-shadow:0 8px 25px #ffb93666}

.timer-wrap{position:absolute;left:0;right:0;bottom:0;height:7px;background:#ffffff0c}.timer{height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--red));transform-origin:left;transition:width .1s linear}.feedback{text-align:center;min-height:30px;margin:8px 0 0;font-weight:900}.feedback.good{color:var(--green)}.feedback.bad{color:#ff8295}.footer-hud{display:flex;align-items:center;justify-content:space-between;gap:12px}.combo{font-weight:1000;color:var(--gold);font-size:1.15rem;text-shadow:0 0 16px #ffd95aaa}.combo.burst{animation:comboBurst .7s}@keyframes comboBurst{0%{transform:scale(.4);opacity:0}45%{transform:scale(1.8) rotate(-5deg);filter:brightness(1.7)}100%{transform:scale(1)}}.progress{color:var(--muted);font-weight:800}.score{font-size:1.25rem;font-weight:1000;color:var(--cyan)}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#090617d9;backdrop-filter:blur(10px);padding:18px}.result{width:min(680px,100%);padding:30px;text-align:center}.result h2{font-size:clamp(2rem,5vw,3.5rem);margin:0;background:linear-gradient(90deg,var(--gold),white,var(--cyan));-webkit-background-clip:text;color:transparent}.rank{font-size:5rem;margin:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{padding:16px 8px;background:#ffffff09;border:1px solid var(--line);border-radius:16px}.stat b{display:block;color:var(--cyan);font-size:1.35rem}.advice{text-align:left;background:#08061788;border-left:4px solid var(--gold);padding:14px 16px;border-radius:12px;color:#ded8ef;line-height:1.55}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary{background:#ffffff0b;border:1px solid var(--line)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0}.flash.go{animation:flash .45s}@keyframes flash{20%{opacity:.5;background:#56f39a}100%{opacity:0}}.damage{position:fixed;z-index:18;font-size:2rem;font-weight:1000;color:var(--gold);text-shadow:0 0 12px #ff4f9f;pointer-events:none;animation:damage 1s forwards}@keyframes damage{to{transform:translateY(-100px) scale(1.5);opacity:0}}
@media(max-width:850px){.start-wrap{grid-template-columns:1fr}.hero{padding:18px}.mascot{width:180px;height:200px;transform:scale(.78);transform-origin:top center;margin-bottom:-30px}.setup{padding:20px}.battle{grid-template-columns:1fr}.mini-char{display:none}.arena{min-height:calc(100dvh - 80px)}.topbar{grid-template-columns:1fr auto}.topbar .meta{grid-column:1/-1;justify-content:flex-start}.hud{grid-template-columns:1fr 1fr}.avatar{width:48px;height:48px}.fighter{gap:8px}.question{margin-top:14px}.answers{grid-template-columns:1fr}.answer{min-height:60px}.footer-hud{font-size:.85rem}.stats{grid-template-columns:1fr 1fr}.result-actions{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

 constructor(){this.ctx=null;this.on=true;this.step=0}
 init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.ctx.resume()}
 tone(freq,dur=.12,type="sine",vol=.08,when=0){if(!this.on||!this.ctx)return;const t=this.ctx.currentTime+when,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+dur)}
 fx(kind){this.init();const map={correct:[[523,.08],[659,.08],[784,.14]],wrong:[[180,.14],[120,.24]],combo:[[659,.08],[784,.08],[988,.08],[1318,.25]],victory:[[523,.12],[659,.12],[784,.12],[1047,.35]],level:[[440,.1],[660,.1],[880,.22]]};(map[kind]||[]).forEach((n,i)=>this.tone(n[0],n[1],kind==="wrong"?"sawtooth":"square",.06,i*.08))}
 start(style){this.stop();if(style==="off"){this.on=false;return}this.on=true;this.init();const seq=style==="victory"?[262,330,392,523,392,330]:[110,165,220,165,247,220,165,196];const beat=style==="victory"?260:170;musicTimer=setInterval(()=>{this.tone(seq[this.step++%seq.length],.11,style==="victory"?"triangle":"sawtooth",.018);if(this.step%2===0)this.tone(55,.07,"square",.012)},beat)}
 stop(){clearInterval(musicTimer);musicTimer=null}
}
audio=new Sound();

function applyTheme(t){const r=document.documentElement;if(t==="candy"){r.style.setProperty("--violet","#ff70c8");r.style.setProperty("--pink","#ff8d5c");r.style.setProperty("--cyan","#7dffdd");r.style.setProperty("--panel","rgba(54,18,58,.82)")}else if(t==="shadow"){r.style.setProperty("--violet","#7b5cff");r.style.setProperty("--pink","#ef3d67");r.style.setProperty("--cyan","#62a8ff");r.style.setProperty("--panel","rgba(7,10,28,.88)")}else{r.style.setProperty("--violet","#9b5cff");r.style.setProperty("--pink","#ff4fa3");r.style.setProperty("--cyan","#37e9ff");r.style.setProperty("--panel","rgba(21,15,48,.82)")}}

$("#setupForm").addEventListener("submit",e=>{e.preventDefault();const data=new FormData(e.target);audio.on=true;G={name:$("#playerName").value.trim()||"Vocab Hero",theme:data.get("theme"),music:data.get("music"),difficulty:data.get("difficulty"),total:+data.get("count"),index:0,score:0,hp:100,boss:100,combo:0,best:0,correct:0,level:1,xp:0,locked:false,start:Date.now(),mistakes:[]};applyTheme(G.theme);audio.start(G.music);G.questions=buildQuestions(G.total);$("#startScreen").classList.add("hidden");$("#gameScreen").classList.remove("hidden");$("#playerLabel").textContent=G.name;renderHUD();nextQuestion()});

function buildQuestions(n){let pool=shuffle(WORDS),out=[];for(let i=0;i<n;i++){const w=pool[i%pool.length],mode=i%5;out.push(makeQuestion(w,mode))}return shuffle(out)}
function makeQuestion(w,mode){let q,h="",opts,answer=w.up;
 if(mode===0){q=`哪个词能把「${w.basic}」升级为更精准的表达？`;opts=shuffle([w.up,...w.alts]);h="Pilih kosa kata yang paling tepat."}
 if(mode===1){q=`“${w.zh}” 的 Bahasa Melayu 是什么？`;opts=shuffle([w.up,...w.alts]);h="根据中文意思选择正确答案。"}
 if(mode===2){const truePair=Math.random()>.45,shown=truePair?w.up:w.alts[Math.floor(Math.random()*w.alts.length)];q=`「${w.zh}」＝「${shown}」`;opts=["BETUL · 正确","SALAH · 错误"];answer=truePair?opts[0]:opts[1];h="判断这组词义配对是否正确。"}
 if(mode===3){q=`限时！「${w.zh}」最准确的词是？`;opts=shuffle([w.up,...w.alts]);h="Masa sedang berjalan — cepat!"}
 if(mode===4){q=`Boss 防御词：${w.basic}\n选择最强攻击词！`;opts=shuffle([w.up,...w.alts]);h="精准答案会造成双倍伤害。"}
 return{w,mode,q,opts,answer}}

function nextQuestion(){clearInterval(timerId);if(G.index>=G.total||G.hp<=0||G.boss<=0){finish();return}G.locked=false;const x=G.questions[G.index],m=MODES[x.mode];$("#modeTag").textContent=`${m.icon} ${m.name}`;$("#question").textContent=x.q;$("#hint").textContent=x.h;$("#feedback").textContent="";$("#feedback").className="feedback";const box=$("#answers");box.innerHTML="";x.opts.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>${v}`;b.addEventListener("click",()=>choose(v,b));box.append(b)});$("#progress").textContent=`${G.index+1} / ${G.total}`;startTimer(x.mode)}
function timeLimit(mode){if(mode!==3&&G.difficulty==="easy")return 0;const base=mode===3?8:G.difficulty==="hard"?10:G.difficulty==="normal"?16:0;return base}
function startTimer(mode){let left=timeLimit(mode),bar=$("#timer");bar.style.width="100%";if(!left){bar.style.opacity="0";return}bar.style.opacity="1";const total=left;timerId=setInterval(()=>{left-=.1;bar.style.width=`${Math.max(0,left/total*100)}%`;if(left<=0){clearInterval(timerId);choose("__TIME__",null)}},100)}

function choose(value,btn){if(G.locked)return;G.locked=true;clearInterval(timerId);$$('.answer').forEach(b=>b.disabled=true);const x=G.questions[G.index],ok=value===x.answer;$$('.answer').forEach(b=>{if(b.textContent.trim().endsWith(x.answer))b.classList.add("correct")});if(btn&&!ok)btn.classList.add("wrong");
 if(ok){G.correct++;G.combo++;G.best=Math.max(G.best,G.combo);const mult=G.combo>=3?2:1,modeMult=x.mode===4?2:1,pts=100*mult*modeMult;G.score+=pts;G.xp+=25;const dmg=(100/G.total)*modeMult*(G.combo>=3?1.35:1);G.boss=Math.max(0,G.boss-dmg);audio.fx(G.combo>=3?"combo":"correct");$("#feedback").textContent=`JAWAPAN TEPAT! +${pts} 分 · ${x.w.up} = ${x.w.zh}`;$("#feedback").className="feedback good";$("#playerChar").classList.add("player-attack");$("#bossChar").classList.add("hit");flash();damageText(`-${Math.round(dmg)}%`,75,35);if(G.combo>=3){const c=$("#combo");c.classList.remove("burst");void c.offsetWidth;c.classList.add("burst")}
 }else{const loss=G.difficulty==="hard"?25:G.difficulty==="easy"?12:18;G.hp=Math.max(0,G.hp-loss);G.combo=0;G.mistakes.push(x.w.up);audio.fx("wrong");$("#feedback").textContent=`${value==="__TIME__"?"MASA TAMAT!":"BELUM TEPAT!"} 正确答案：${x.answer} · ${x.w.zh}`;$("#feedback").className="feedback bad";$("#playerChar").classList.add("player-hurt");damageText(`-${loss} HP`,18,32)}
 const old=G.level;G.level=1+Math.floor(G.xp/100);if(G.level>old)audio.fx("level");renderHUD();setTimeout(()=>{$("#playerChar").classList.remove("player-attack","player-hurt");$("#bossChar").classList.remove("hit");G.index++;nextQuestion()},G.difficulty==="easy"?1500:1100)}

function renderHUD(){$("#playerHp").style.width=G.hp+"%";$("#hpText").textContent=G.hp+" HP";$("#bossHp").style.width=G.boss+"%";$("#bossHpText").textContent=Math.ceil(G.boss)+"%";$("#xpBar").style.width=(G.xp%100)+"%";$("#levelChip").textContent="LV."+G.level;$("#scoreChip").textContent=G.score+" 分";$("#score").textContent=G.score+" PTS";$("#combo").textContent="COMBO ×"+G.combo}
function flash(){const f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}
function damageText(txt,x,y){const d=document.createElement("div");d.className="damage";d.textContent=txt;d.style.left=x+"%";d.style.top=y+"%";document.body.append(d);setTimeout(()=>d.remove(),1000)}

function finish(){clearInterval(timerId);audio.stop();if(G.correct/G.total>=.6)audio.fx("victory");const acc=Math.round(G.correct/G.total*100),sec=Math.round((Date.now()-G.start)/1000);$("#resultOverlay").classList.remove("hidden");$("#resultTitle").textContent=G.hp<=0?"继续修炼，再来！":G.boss<=0?"Boss 击破！Hebat!":"挑战完成！Syabas!";$("#rank").textContent=acc>=90?"👑":acc>=75?"🏆":acc>=60?"⭐":"📚";$("#finalScore").textContent=G.score;$("#accuracy").textContent=acc+"%";$("#bestCombo").textContent=G.best;$("#finalLevel").textContent=G.level;$("#correctCount").textContent=`${G.correct}/${G.total}`;$("#timeUsed").textContent=sec+"s";let advice;if(acc>=90)advice="你已经能快速调用精准词汇。下一步：不用选项，把这些词写成完整句子，让“认识”升级为“会用”。";else if(acc>=70)advice="基础稳固，但仍有词义混淆。复习错题时用「中文意思 → BM 词 → 自创句子」三步法。";else advice="先缩小能力圈：每天只练 5 个词，每个词完成读、遮、说、写四次循环，再挑战 Battle。";const miss=[...new Set(G.mistakes)].slice(0,6);if(miss.length)advice+=` 重点复习：${miss.join("、")}。`;$("#advice").textContent=advice}

$("#muteBtn").addEventListener("click",()=>{audio.on=!audio.on;$("#muteBtn").textContent=audio.on?"🔊":"🔇";if(audio.on)audio.start(G.music);else audio.stop()});
$("#restartBtn").addEventListener("click",()=>{$("#resultOverlay").classList.add("hidden");audio.start(G.music);Object.assign(G,{index:0,score:0,hp:100,boss:100,combo:0,best:0,correct:0,level:1,xp:0,locked:false,start:Date.now(),mistakes:[]});G.questions=buildQuestions(G.total);renderHUD();nextQuestion()});
$("#homeBtn").addEventListener("click",()=>{audio.stop();$("#resultOverlay").classList.add("hidden");$("#gameScreen").classList.add("hidden");$("#startScreen").classList.remove("hidden")});
document.addEventListener("keydown",e=>{if($("#gameScreen").classList.contains("hidden")||G.locked)return;const i=["1","2","3","4","a","b","c","d"].indexOf(e.key.toLowerCase())%4;if(i>=0){const b=$$(".answer")[i];if(b)b.click()}});
</script>
